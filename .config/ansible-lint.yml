---

# https://ansible.readthedocs.io/projects/lint/configuring/

profile: production

# name[casing] only. Task names in this role follow a `section | action`
# convention -- the section prefix matches the task file it lives in, so
# `ansible-playbook --tags` output reads as the phase it belongs to. That
# convention is lowercase by design; nothing else is skipped.
skip_list:
  - name[casing]

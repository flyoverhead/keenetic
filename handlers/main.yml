---

- name: repos | update cache
  ansible.builtin.command:
    cmd: opkg update
  changed_when: true
  register: keenetic_update_result
  failed_when:
    - keenetic_update_result.rc != 0
    - keenetic_update_result.rc != 1

- name: dropbear | restart
  become: true
  ansible.builtin.command:
    cmd: /opt/etc/init.d/S51dropbear restart
  changed_when: true

- name: cron | restart
  become: true
  ansible.builtin.command:
    cmd: /opt/etc/init.d/S10cron restart
  changed_when: true

- name: xray | restart
  become: true
  ansible.builtin.command:
    cmd: /opt/etc/init.d/S24xray restart
  changed_when: true

- name: pxe | restart tftpd
  become: true
  ansible.builtin.command:
    cmd: /opt/etc/init.d/S59tftpd restart
  changed_when: true

# Without this the boot fields live only in the running configuration and are
# gone after the next reboot or power cut -- network boot then stops working
# with nothing in the role's output to explain it.
- name: pxe | save router configuration
  become: true
  ansible.builtin.command:
    cmd: ndmc -c "system configuration save"
  changed_when: true

# Notified only when the ENABLED= line actually flips, so a router where the
# stock instance was never running (or already disabled) is not made to run an
# unnecessary stop command. failed_when: false because it may not be running.
- name: pxe | stop the packaged lighttpd
  become: true
  ansible.builtin.command:
    cmd: /opt/etc/init.d/S80lighttpd stop
  changed_when: true
  failed_when: false

- name: pxe | restart httpd
  become: true
  ansible.builtin.command:
    cmd: /opt/etc/init.d/S82pxehttpd restart
  changed_when: true
